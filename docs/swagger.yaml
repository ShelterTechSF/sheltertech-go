host: localhost:3001
info:
  contact: {}
  description: API for the ShelterTech SF Service Guide application.
  title: ShelterTech API
  version: "1.0"
paths:
  /bookmarks:
    get:
      consumes:
      - application/json
      description: get all bookmarks, optionally filtered by user_id
      parameters:
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bookmarks.Bookmarks'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Error'
      summary: Get Bookmarks
      tags:
      - bookmarks
    post:
      consumes:
      - application/json
      description: create a new bookmark
      parameters:
      - description: Bookmark object
        in: body
        name: bookmark
        required: true
        schema:
          $ref: '#/definitions/bookmarks.Bookmark'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Error'
      summary: Create Bookmark
      tags:
      - bookmarks
  /bookmarks/{id}:
    delete:
      consumes:
      - application/json
      description: delete a bookmark by its ID
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
      summary: Delete Bookmark
      tags:
      - bookmarks
    get:
      consumes:
      - application/json
      description: get a single bookmark by its ID
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bookmarks.Bookmark'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Error'
      summary: Get Bookmark by ID
      tags:
      - bookmarks
    put:
      consumes:
      - application/json
      description: update an existing bookmark by ID
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      - description: Bookmark object
        in: body
        name: bookmark
        required: true
        schema:
          $ref: '#/definitions/bookmarks.Bookmark'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Error'
      summary: Update Bookmark
      tags:
      - bookmarks
  /categories:
    get:
      consumes:
      - application/json
      description: get all categories
      parameters:
      - description: Filter to top-level categories only
        in: query
        name: top_level
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/categories.Categories'
      summary: Get Categories
      tags:
      - categories
  /categories/{id}:
    get:
      description: get a single category by its ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/categories.Category'
      summary: Get Category by ID
      tags:
      - categories
  /categories/counts:
    get:
      description: get service and resource counts for each category
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/categories.CategoryCountDTO'
            type: array
      summary: Get Category Counts
      tags:
      - categories
  /categories/featured:
    get:
      description: get all featured categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/categories.Categories'
      summary: Get Featured Categories
      tags:
      - categories
  /categories/subcategories/{id}:
    get:
      description: get subcategories for a given parent category ID
      parameters:
      - description: Parent Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/categories.Categories'
      summary: Get Subcategories by Category ID
      tags:
      - categories
  /change_requests:
    post:
      consumes:
      - application/json
      description: create a new change request (e.g. for phones)
      parameters:
      - description: Change request payload
        in: body
        name: change_request
        required: true
        schema:
          $ref: '#/definitions/changerequest.ChangeRequestPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/changerequest.PhoneChangeRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Error'
      summary: Create Change Request
      tags:
      - change_requests
  /datathon/content_curation_dataset:
    get:
      description: gives a csv of the content curation dataset
      produces:
      - text/csv
      responses:
        "200":
          description: CSV data
          schema:
            type: string
      summary: Get Content Curation Dataset
      tags:
      - datathon
  /datathon/datathon_dataset:
    get:
      description: gives a csv of the datathon dataset
      produces:
      - text/csv
      responses:
        "200":
          description: CSV data
          schema:
            type: string
      summary: Get Datathon Dataset
      tags:
      - datathon
  /eligibilities:
    get:
      description: Get all eligibilities sorted by name in ascending order, with optional
        filtering by category.
      parameters:
      - description: Filter eligibilities by category ID
        in: query
        name: categoryId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/eligibilities.Eligibility'
            type: array
      summary: Get Eligibilities
      tags:
      - eligibilities
  /eligibilities/{id}:
    get:
      description: Get a specific eligibility by its ID.
      parameters:
      - description: Eligibility ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/eligibilities.Eligibility'
        "400":
          description: Invalid eligibility ID format
          schema: {}
        "404":
          description: Eligibility not found
          schema: {}
        "500":
          description: Internal server error
          schema: {}
      summary: Get Eligibility
      tags:
      - eligibilities
    put:
      consumes:
      - application/json
      description: Update an existing eligibility's name or feature rank.
      parameters:
      - description: Eligibility ID
        in: path
        name: id
        required: true
        type: integer
      - description: Eligibility update parameters
        in: body
        name: body
        schema:
          type: object
      - description: New name for this eligibility
        in: body
        name: name
        schema:
          type: string
      - description: New feature rank for this eligibility (can be null)
        in: body
        name: feature_rank
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/eligibilities.Eligibility'
        "400":
          description: Invalid request or duplicate name
          schema: {}
        "404":
          description: Eligibility not found
          schema: {}
        "500":
          description: Internal server error
          schema: {}
      summary: Update Eligibility
      tags:
      - eligibilities
  /eligibilities/subeligibilities:
    get:
      description: Returns child eligibilities for a parent eligibility, identified
        either by ID or name.
      parameters:
      - description: Parent eligibility ID
        in: query
        name: id
        type: integer
      - description: Parent eligibility name
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/eligibilities.Eligibility'
            type: array
        "400":
          description: Bad request - unexpected query parameter or missing required
            parameters
          schema: {}
        "422":
          description: Unprocessable Entity - invalid parent eligibility ID format
          schema: {}
      summary: Get Subeligibilities
      tags:
      - eligibilities
  /folders:
    get:
      consumes:
      - application/json
      description: get folders for user
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/folders.Folders'
        "400":
          description: Bad Request
      summary: Get Folders for current User
      tags:
      - folders
    post:
      consumes:
      - application/json
      description: new folder for user
      parameters:
      - description: Folder object
        in: body
        name: folder
        required: true
        schema:
          $ref: '#/definitions/folders.Folder'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/folders.Folder'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create Folder for current User
      tags:
      - folders
  /folders/{id}:
    delete:
      consumes:
      - application/json
      description: delete a folder for user
      parameters:
      - description: Folder ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete folder by ID
      tags:
      - folders
    get:
      consumes:
      - application/json
      description: get current folder for user
      parameters:
      - description: Folder ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/folders.Folder'
        "400":
          description: Bad Request
        "404":
          description: Not Found
      summary: Get folder by ID
      tags:
      - folders
    put:
      consumes:
      - application/json
      description: update a folder for user
      parameters:
      - description: Folder ID
        in: path
        name: id
        required: true
        type: integer
      - description: Folder object
        in: body
        name: folder
        required: true
        schema:
          $ref: '#/definitions/folders.Folder'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update folder by ID
      tags:
      - folders
  /news_articles:
    get:
      description: Get all news articles with optional filtering for active articles
        only
      parameters:
      - description: Filter for active news articles only
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/newsarticles.NewsArticle'
            type: array
      summary: Get News Articles
      tags:
      - news_articles
    post:
      consumes:
      - application/json
      description: Create a new news article
      parameters:
      - description: News article data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/newsarticles.NewsArticleCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/newsarticles.NewsArticle'
        "400":
          description: Invalid request body
          schema: {}
        "500":
          description: Internal server error
          schema: {}
      summary: Create News Article
      tags:
      - news_articles
  /news_articles/{id}:
    delete:
      description: Delete an existing news article
      parameters:
      - description: News Article ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Empty response on success
          schema:
            type: object
        "400":
          description: Invalid news article ID format
          schema: {}
        "404":
          description: News article not found
          schema: {}
        "500":
          description: Internal server error
          schema: {}
      summary: Delete News Article
      tags:
      - news_articles
    put:
      consumes:
      - application/json
      description: Update an existing news article
      parameters:
      - description: News Article ID
        in: path
        name: id
        required: true
        type: integer
      - description: News article update data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/newsarticles.NewsArticleUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/newsarticles.NewsArticle'
        "400":
          description: Invalid request body
          schema: {}
        "404":
          description: News article not found
